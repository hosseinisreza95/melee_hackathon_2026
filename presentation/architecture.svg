<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1320" viewBox="0 0 680 660" role="img">
<title>Architecture LPC regulatory watch</title>
<desc>Quatre sources officielles alimentent un pipeline nocturne (collecte, parsing, normalisation, extraction PDF) qui remplit PostgreSQL ; l'API FastAPI expose des points REST et l'agent /ask ; trois consommateurs : chat Streamlit, Microsoft 365, exports.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>
text{font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif}
.th{font-size:14px;font-weight:500}.ts{font-size:12px}
.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}
.box{fill:#FAFAF8;stroke:#B4B2A9}
.teal rect{fill:#E1F5EE;stroke:#0F6E56}.teal .th{fill:#085041}.teal .ts{fill:#0F6E56}
.purple rect{fill:#EEEDFE;stroke:#534AB7}.purple .th{fill:#3C3489}.purple .ts{fill:#534AB7}
.coral rect{fill:#FAECE7;stroke:#993C1D}.coral .th{fill:#712B13}.coral .ts{fill:#993C1D}
.gray rect{fill:#F1EFE8;stroke:#5F5E5A}.gray .th{fill:#444441}.gray .ts{fill:#5F5E5A}
.lbl{fill:#2C2C2A}
</style>
<rect width="680" height="660" fill="#ffffff"/>

<g class="teal"><rect x="50" y="40" width="130" height="56" rx="8" stroke-width="0.7"/><text class="th" x="115" y="58" text-anchor="middle" dominant-baseline="central">Santé Canada</text><text class="ts" x="115" y="78" text-anchor="middle" dominant-baseline="central">PPID, CSV quotidien</text></g>
<g class="teal"><rect x="200" y="40" width="130" height="56" rx="8" stroke-width="0.7"/><text class="th" x="265" y="58" text-anchor="middle" dominant-baseline="central">US EPA PPLS</text><text class="ts" x="265" y="78" text-anchor="middle" dominant-baseline="central">JSON + PDF</text></g>
<g class="teal"><rect x="350" y="40" width="130" height="56" rx="8" stroke-width="0.7"/><text class="th" x="415" y="58" text-anchor="middle" dominant-baseline="central">ANSES E-Phy</text><text class="ts" x="415" y="78" text-anchor="middle" dominant-baseline="central">ZIP hebdomadaire</text></g>
<g class="teal"><rect x="500" y="40" width="130" height="56" rx="8" stroke-width="0.7"/><text class="th" x="565" y="58" text-anchor="middle" dominant-baseline="central">MAPA AGROFIT</text><text class="ts" x="565" y="78" text-anchor="middle" dominant-baseline="central">CSV, 392 Mo</text></g>

<line x1="115" y1="96" x2="115" y2="128" class="arr" marker-end="url(#arrow)"/>
<line x1="265" y1="96" x2="265" y2="128" class="arr" marker-end="url(#arrow)"/>
<line x1="415" y1="96" x2="415" y2="128" class="arr" marker-end="url(#arrow)"/>
<line x1="565" y1="96" x2="565" y2="128" class="arr" marker-end="url(#arrow)"/>

<rect class="box" x="40" y="130" width="600" height="122" rx="12" stroke-width="0.7" stroke-dasharray="4 3"/>
<text class="th lbl" x="56" y="150" dominant-baseline="central">Pipeline nocturne (cron 03:30 UTC)</text>
<g class="purple"><rect x="56" y="172" width="122" height="56" rx="8" stroke-width="0.7"/><text class="th" x="117" y="190" text-anchor="middle" dominant-baseline="central">Collecteurs</text><text class="ts" x="117" y="210" text-anchor="middle" dominant-baseline="central">brut + provenance</text></g>
<g class="purple"><rect x="196" y="172" width="122" height="56" rx="8" stroke-width="0.7"/><text class="th" x="257" y="190" text-anchor="middle" dominant-baseline="central">Parsers</text><text class="ts" x="257" y="210" text-anchor="middle" dominant-baseline="central">originaux verbatim</text></g>
<g class="purple"><rect x="336" y="172" width="122" height="56" rx="8" stroke-width="0.7"/><text class="th" x="397" y="190" text-anchor="middle" dominant-baseline="central">Normalisation</text><text class="ts" x="397" y="210" text-anchor="middle" dominant-baseline="central">EPPO, unités, alias</text></g>
<g class="purple"><rect x="476" y="172" width="122" height="56" rx="8" stroke-width="0.7"/><text class="th" x="537" y="190" text-anchor="middle" dominant-baseline="central">Extraction PDF</text><text class="ts" x="537" y="210" text-anchor="middle" dominant-baseline="central">LLM, extrait vérifié</text></g>
<line x1="178" y1="200" x2="194" y2="200" class="arr" marker-end="url(#arrow)"/>
<line x1="318" y1="200" x2="334" y2="200" class="arr" marker-end="url(#arrow)"/>
<line x1="458" y1="200" x2="474" y2="200" class="arr" marker-end="url(#arrow)"/>

<line x1="340" y1="252" x2="340" y2="288" class="arr" marker-end="url(#arrow)"/>

<g class="gray"><rect x="190" y="290" width="300" height="56" rx="8" stroke-width="0.7"/><text class="th" x="340" y="308" text-anchor="middle" dominant-baseline="central">PostgreSQL 16</text><text class="ts" x="340" y="328" text-anchor="middle" dominant-baseline="central">produits, homologations, usages, snapshots</text></g>

<line x1="340" y1="346" x2="340" y2="384" class="arr" marker-end="url(#arrow)"/>

<rect class="box" x="40" y="386" width="600" height="130" rx="12" stroke-width="0.7" stroke-dasharray="4 3"/>
<text class="th lbl" x="56" y="406" dominant-baseline="central">API FastAPI, derrière Caddy sous /api</text>
<g class="coral"><rect x="56" y="428" width="200" height="56" rx="8" stroke-width="0.7"/><text class="th" x="156" y="446" text-anchor="middle" dominant-baseline="central">Points REST</text><text class="ts" x="156" y="466" text-anchor="middle" dominant-baseline="central">/compare, /expiring, /export</text></g>
<g class="coral"><rect x="276" y="428" width="340" height="56" rx="8" stroke-width="0.7"/><text class="th" x="446" y="446" text-anchor="middle" dominant-baseline="central">Agent /ask</text><text class="ts" x="446" y="466" text-anchor="middle" dominant-baseline="central">planificateur, outils SQL, gpt-5 + garde</text></g>

<line x1="140" y1="516" x2="140" y2="558" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="516" x2="340" y2="558" class="arr" marker-end="url(#arrow)"/>
<line x1="540" y1="516" x2="540" y2="558" class="arr" marker-end="url(#arrow)"/>

<g class="teal"><rect x="50" y="560" width="180" height="56" rx="8" stroke-width="0.7"/><text class="th" x="140" y="578" text-anchor="middle" dominant-baseline="central">Chat Streamlit</text><text class="ts" x="140" y="598" text-anchor="middle" dominant-baseline="central">carte, fils, tableaux</text></g>
<g class="teal"><rect x="250" y="560" width="180" height="56" rx="8" stroke-width="0.7"/><text class="th" x="340" y="578" text-anchor="middle" dominant-baseline="central">Microsoft 365</text><text class="ts" x="340" y="598" text-anchor="middle" dominant-baseline="central">Power Automate, Copilot</text></g>
<g class="teal"><rect x="450" y="560" width="180" height="56" rx="8" stroke-width="0.7"/><text class="th" x="540" y="578" text-anchor="middle" dominant-baseline="central">Exports</text><text class="ts" x="540" y="598" text-anchor="middle" dominant-baseline="central">CSV, Excel, Dataverse</text></g>
</svg>
